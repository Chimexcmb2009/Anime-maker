<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Film Reel / Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" stroke-dasharray="16 10" />

  <!-- Clapperboard top / Skit action symbol -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="232" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <!-- Chevrons -->
    <polygon points="20,0 45,0 25,48 0,48" fill="#10b981" />
    <polygon points="75,0 100,0 80,48 55,48" fill="#f59e0b" />
    <polygon points="130,0 155,0 135,48 110,48" fill="#10b981" />
    <polygon points="185,0 210,0 190,48 165,48" fill="#f59e0b" />
  </g>

  <!-- Animated Stick Man (Expressive Comedy Pose) -->
  <g id="stickman" transform="translate(256, 300)" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stick Man Head with Comedy Expression -->
    <circle cx="0" cy="-70" r="34" fill="#fef08a" stroke="#f59e0b" stroke-width="8" filter="url(#glow)" />
    <!-- Eyes and wide laughing mouth on head -->
    <circle cx="-10" cy="-75" r="4" fill="#0f172a" />
    <circle cx="10" cy="-75" r="4" fill="#0f172a" />
    <path d="M -12 -62 Q 0 -50 12 -62" stroke="#0f172a" stroke-width="4" fill="none" />

    <!-- Stick Body -->
    <line x1="0" y1="-36" x2="0" y2="45" stroke="#38bdf8" stroke-width="12" />

    <!-- Expressive Arms (Celebration / Dancing pose) -->
    <!-- Left arm raised -->
    <path d="M 0 -15 L -45 -45 L -75 -20" stroke="#f59e0b" stroke-width="10" />
    <!-- Right arm with megaphone / mic -->
    <path d="M 0 -15 L 45 -40 L 70 -65" stroke="#10b981" stroke-width="10" />

    <!-- Legs (Energetic jump / strut) -->
    <path d="M 0 45 L -35 90 L -55 125" stroke="#38bdf8" stroke-width="10" />
    <path d="M 0 45 L 35 85 L 60 120" stroke="#38bdf8" stroke-width="10" />
  </g>

  <!-- Audio Soundwaves (Naija Skits Audio) -->
  <g transform="translate(340, 210)" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 0 0 C 15 -15 15 -35 0 -50" opacity="0.9" />
    <path d="M 16 8 C 36 -12 36 -42 16 -62" opacity="0.7" />
    <path d="M 32 16 C 58 -8 58 -52 32 -76" opacity="0.5" />
  </g>

  <!-- Play / Clapboard sparkle badge -->
  <circle cx="150" cy="340" r="28" fill="#f59e0b" />
  <polygon points="144,328 162,340 144,352" fill="#0f172a" />
</svg>
